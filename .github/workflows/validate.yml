name: Validate investigation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python investigate.py --output /tmp/replay
      - run: diff reports/findings.json /tmp/replay/findings.json
      - name: Reproduce original evidence reports
        run: |
          python coverage.py
          python inspect_public_rdp.py
          python investigate_public_rdp.py
          git diff --exit-code -- reports
